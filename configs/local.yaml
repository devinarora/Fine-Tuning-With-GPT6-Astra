seed: 42
runtime:
  run_root: ~/fr-en-ft/runs
  cache_root: ~/fr-en-ft/cache
  budget_seconds: 7200
  checkpoint_seconds: 240
  evaluation_reserve_seconds: 1800
  gpu_memory_gib: 4.8
  free_gpu_reserve_gib: 1.5
data:
  train_per_source: 10000
  validation_per_source: 250
  test_per_source: 500
  max_source_tokens: 256
  max_target_tokens: 256
training:
  epochs: 2
  micro_batch_size: 2
  effective_batch_size: 16
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_fraction: 0.05
  validation_seconds: 600
  early_stopping_patience: 3
evaluation:
  beams: 4
  batch_size: 4
  bertscore: true
  bootstrap_samples: 1000
